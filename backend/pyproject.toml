[project]
name = "cms-planner-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.1,<3",
    "pillow>=11,<13",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20,<1",
    "pytesseract>=0.3.13,<1",
    "uvicorn>=0.24,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.fastapi]
entrypoint = "api.main:app"